# DarkIntel — orquestacion con aislamiento de red en cuatro redes.
#
#   tor_egress (salida)      : SOLO tor-proxy y test-onion. Unica red con
#                              salida a internet, y solo la usa el daemon Tor.
#   darknet    (riesgo)      : tor-proxy + scraper (+ test-onion). internal=true:
#                              el scraper NO tiene salida directa a internet;
#                              su unico camino hacia afuera es el SOCKS de Tor.
#                              Si algo intenta salir sin Tor, no hay ruta (fail-closed).
#   backend    (procesamiento): processor + db. internal=true, sin salida a
#                              internet. Nunca escribe hacia darknet.
#   frontend   (exposicion)   : api. Unico servicio con puerto publicado.
#
# El volumen raw_data es el UNICO punto de contacto entre darknet y backend:
# el scraper lo escribe, el processor lo lee en solo-lectura. Si el contenedor
# del scraper se ve comprometido por contenido .onion, no tiene ruta de red
# hacia la base de datos ni hacia internet sin pasar por Tor.
#
# Variables obligatorias (definirlas en .env): POSTGRES_PASSWORD y
# TOR_CONTROL_PASSWORD. Sin ellas `docker compose` se niega a arrancar, a
# proposito: nada de contraseñas por defecto conocidas.

name: darkintel

networks:
  tor_egress:
    name: darkintel_tor_egress
    # NO es internal: el daemon Tor necesita salida a internet para construir
    # circuitos. Solo tor-proxy y test-onion se conectan aqui.
  darknet:
    name: darkintel_darknet
    internal: true          # scraper <-> tor-proxy, sin salida directa
  backend:
    name: darkintel_backend
    internal: true
  frontend:
    name: darkintel_frontend

volumes:
  raw_data:        # scraper (rw) -> processor (ro)
  testonion_data:  # claves del hidden service de prueba: sin esto la direccion
                   # .onion cambia en cada recreacion del contenedor
  output_data:     # processor (rw) -> api (ro)
  pgdata:

services:

  # ── Zona de riesgo ────────────────────────────────────────────────────
  tor-proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.tor
    image: darkintel/tor-proxy:dev
    container_name: darkintel-tor
    # darknet: para que el scraper lo alcance como tor-proxy:9050
    # tor_egress: para que Tor pueda salir a internet
    networks: [darknet, tor_egress]
    restart: unless-stopped
    environment:
      # El entrypoint genera el HashedControlPassword a partir de esta
      # variable al arrancar (ver docker/tor-entrypoint.sh). El hash ya no
      # vive en docker/torrc ni en el repositorio.
      TOR_CONTROL_PASSWORD: ${TOR_CONTROL_PASSWORD:?Define TOR_CONTROL_PASSWORD en .env}
    healthcheck:
      # Verifica que el SOCKS5 realmente enruta trafico por Tor.
      test: ["CMD-SHELL", "curl -s --socks5-hostname localhost:9050 https://check.torproject.org/api/ip | grep -q '\"IsTor\":true'"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  # Objetivo de prueba local — ver SAFE_TESTING.md, Etapa 1. NO se levanta
  # con `docker compose up`: solo con `--profile testing`, para que no
  # termine expuesto por accidente fuera del entorno de pruebas.
  test-onion:
    build:
      context: .
      dockerfile: docker/Dockerfile.test-onion
    image: darkintel/test-onion:dev
    container_name: darkintel-test-onion
    # tor_egress: su propio daemon Tor necesita publicar el descriptor del
    # hidden service en la red Tor.
    networks: [darknet, tor_egress]
    profiles: ["testing"]
    restart: "no"
    volumes:
      # Persiste las claves del hidden service para que la direccion .onion
      # sea estable entre reinicios (si no, hay que volver a leerla cada vez).
      - testonion_data:/var/lib/tor
    security_opt:
      - no-new-privileges:true

  scraper:
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper
    image: darkintel/scraper:dev
    container_name: darkintel-scraper
    networks: [darknet]          # SOLO darknet (internal): sin backend y sin internet directo
    restart: "no"
    volumes:
      - raw_data:/app/data/raw   # unico canal hacia el backend
    environment:
      TOR_SOCKS_PROXY: socks5h://tor-proxy:9050
      TOR_CONTROL_HOST: tor-proxy
      TOR_CONTROL_PORT: 9051
      TOR_CONTROL_PASSWORD: ${TOR_CONTROL_PASSWORD:?Define TOR_CONTROL_PASSWORD en .env}
      # Controla la etapa de prueba sin tocar código (ver SAFE_TESTING.md).
      # Sin valor por defecto a proposito: si no se define, fetcher.py sale
      # con un mensaje claro en vez de fallar contra un objetivo invalido.
      SCRAPER_TARGET_URL: ${SCRAPER_TARGET_URL:-}
    depends_on:
      tor-proxy:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ── Zona de procesamiento ─────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: darkintel-db
    networks: [backend]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darkintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-darkintel}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darkintel} -d ${POSTGRES_DB:-darkintel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin `ports:` — la base de datos no es alcanzable desde el host ni desde
    # darknet. Para inspeccionarla: docker compose exec db psql -U darkintel

  processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: darkintel/processor:dev
    container_name: darkintel-processor
    networks: [backend]
    restart: "no"                # job de un solo uso, no servicio
    volumes:
      - raw_data:/app/data/raw:ro      # solo lectura: nunca escribe hacia darknet
      - output_data:/app/data/output
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-darkintel}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/${POSTGRES_DB:-darkintel}
      # Modelo NER: el de HuggingFace (por defecto) o uno ajustado copiado en
      # modelos/ (ver entrenamiento/README.md), p. ej. /app/modelos/darkintel-ner-v1
      DARKINTEL_NER_MODEL: ${DARKINTEL_NER_MODEL:-CyberPeace-Institute/SecureBERT-NER}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # ── Zona de exposicion ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: darkintel/api:dev
    container_name: darkintel-api
    # Solo frontend: hoy la API no usa la BD, asi que no necesita ruta hacia
    # backend ni credenciales. Cuando lea de PostgreSQL, volver a agregar
    # `backend` y usar un rol de SOLO LECTURA, no el usuario principal.
    networks: [frontend]
    restart: unless-stopped
    ports:
      # 127.0.0.1: la API solo es accesible desde el propio host, no desde
      # la red local ni internet.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - output_data:/app/data/output:ro   # solo sirve lo ya generado
    depends_on:
      processor:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true